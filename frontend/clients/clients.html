<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Clients - SAAS</title>

        <!-- On relie le CSS global -->
        <link href="../style.css" rel="stylesheet" />
    </head>
    <body>
        <!-- Barre de navigation commune -->
        <nav>
            <div class="nav-container">
                <a href="../index.html" class="nav-logo">SAAS</a>
                <ul class="nav-links">
                    <li><a href="../clients/clients.html" class="active">Clients</a></li>
                    <li><a href="../devis/devis.html">Devis</a></li>
                    <li><a href="../factures/factures.html">Factures</a></li>
                </ul>
            </div>
        </nav>

        <!-- En-tête avec indicateurs -->
        <header class="clients-header">
            <div class="header-content">
                <h1>Gestion des Clients & Prospects</h1>
                <p>Gérez efficacement votre portefeuille client</p>
            </div>
            
            <!-- Indicateurs visuels -->
            <div class="stats-container">
                <div class="stat-card clients-stat">
                    <div class="stat-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M16 7C16 9.20914 14.2091 11 12 11C9.79086 11 8 9.20914 8 7C8 4.79086 9.79086 3 12 3C14.2091 3 16 4.79086 16 7Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M12 14C8.13401 14 5 17.134 5 21H19C19 17.134 15.866 14 12 14Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="stat-info">
                        <span class="stat-number" id="clients-count">0</span>
                        <span class="stat-label">Clients</span>
                    </div>
                </div>
                
                <div class="stat-card prospects-stat">
                    <div class="stat-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M17 21V19C17 17.9391 16.5786 16.9217 15.8284 16.1716C15.0783 15.4214 14.0609 15 13 15H5C3.93913 15 2.92172 15.4214 2.17157 16.1716C1.42143 16.9217 1 17.9391 1 19V21" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M9 11C11.2091 11 13 9.20914 13 7C13 4.79086 11.2091 3 9 3C6.79086 3 5 4.79086 5 7C5 9.20914 6.79086 11 9 11Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M23 21V19C22.9993 18.1137 22.7044 17.2528 22.1614 16.5523C21.6184 15.8519 20.8581 15.3516 20 15.13" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M16 3.13C16.8604 3.35031 17.623 3.85071 18.1676 4.55232C18.7122 5.25392 19.0078 6.11683 19.0078 7.005C19.0078 7.89318 18.7122 8.75608 18.1676 9.45769C17.623 10.1593 16.8604 10.6597 16 10.88" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="stat-info">
                        <span class="stat-number" id="prospects-count">0</span>
                        <span class="stat-label">Prospects</span>
                    </div>
                </div>
                
                <div class="stat-card total-stat">
                    <div class="stat-icon">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M12 2L2 7L12 12L22 7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M2 17L12 22L22 17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            <path d="M2 12L12 17L22 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                    </div>
                    <div class="stat-info">
                        <span class="stat-number" id="total-count">0</span>
                        <span class="stat-label">Total</span>
                    </div>
                </div>
            </div>
        </header>

        <!-- Contenu principal -->
        <main class="clients-main">
            <!-- Barre d'actions -->
            <div class="actions-bar">
                <div class="search-filter-section">
                    <div class="search-box">
                        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="11" cy="11" r="8" stroke="currentColor" stroke-width="2"/>
                            <path d="m21 21-4.35-4.35" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        </svg>
                        <input type="text" id="search-input" placeholder="Rechercher par nom ou email..." />
                    </div>
                    
                    <select id="type-filter" class="filter-select">
                        <option value="all">Tous</option>
                        <option value="client">Clients</option>
                        <option value="prospect">Prospects</option>
                    </select>
                </div>
                
                <button id="add-client-btn" class="add-btn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12 5V19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M5 12H19" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    Ajouter
                </button>
            </div>

            <!-- Formulaire d'ajout/modification -->
            <div id="client-form-container" class="form-container hidden">
                <div class="form-card">
                    <div class="form-header">
                        <h3 id="form-title">Ajouter un client/prospect</h3>
                        <button id="close-form-btn" class="close-btn">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <path d="M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                                <path d="M6 6L18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                            </svg>
                        </button>
                    </div>
                    
                    <form id="client-form">
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="nom">Nom *</label>
                                <input type="text" id="nom" name="nom" required />
                            </div>
                            
                            <div class="form-group">
                                <label for="prenom">Prénom *</label>
                                <input type="text" id="prenom" name="prenom" required />
                            </div>
                            
                            <div class="form-group">
                                <label for="email">Email *</label>
                                <input type="email" id="email" name="email" required />
                            </div>
                            
                            <div class="form-group">
                                <label for="telephone">Téléphone</label>
                                <input type="tel" id="telephone" name="telephone" />
                            </div>
                            
                            <div class="form-group full-width">
                                <label for="adresse">Adresse</label>
                                <input type="text" id="adresse" name="adresse" />
                            </div>
                            
                            <div class="form-group">
                                <label for="ville">Ville</label>
                                <input type="text" id="ville" name="ville" />
                            </div>
                            
                            <div class="form-group">
                                <label for="code_postal">Code postal</label>
                                <input type="text" id="code_postal" name="code_postal" />
                            </div>
                            
                            <div class="form-group">
                                <label for="pays">Pays</label>
                                <input type="text" id="pays" name="pays" value="France" />
                            </div>
                            
                            <div class="form-group">
                                <label for="type">Type *</label>
                                <select id="type" name="type" required>
                                    <option value="prospect">Prospect</option>
                                    <option value="client">Client</option>
                                </select>
                            </div>
                            
                            <div class="form-group">
                                <label for="statut">Statut</label>
                                <select id="statut" name="statut">
                                    <option value="actif">Actif</option>
                                    <option value="inactif">Inactif</option>
                                </select>
                            </div>
                            
                            <div class="form-group full-width">
                                <label for="notes">Notes/Commentaires</label>
                                <textarea id="notes" name="notes" rows="3" placeholder="Informations complémentaires..."></textarea>
                            </div>
                        </div>
                        
                        <div class="form-actions">
                            <button type="button" id="cancel-btn" class="btn-secondary">Annuler</button>
                            <button type="submit" id="submit-btn" class="btn-primary">Ajouter</button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- Liste des clients -->
            <div id="clients-container" class="clients-grid">
                <!-- Les clients seront ajoutés ici dynamiquement -->
            </div>
            
            <!-- Message si aucun client -->
            <div id="no-clients-message" class="no-data-message hidden">
                <div class="no-data-icon">
                    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M16 7C16 9.20914 14.2091 11 12 11C9.79086 11 8 9.20914 8 7C8 4.79086 9.79086 3 12 3C14.2091 3 16 4.79086 16 7Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M12 14C8.13401 14 5 17.134 5 21H19C19 17.134 15.866 14 12 14Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <h3>Aucun client trouvé</h3>
                <p>Commencez par ajouter votre premier client ou prospect</p>
                <button class="btn-primary" onclick="document.getElementById('add-client-btn').click()">Ajouter un client</button>
            </div>
        </main>

        <!-- Script spécifique à cette page -->
        <script type="module" src="./clients.js"></script>
    </body>
</html>
